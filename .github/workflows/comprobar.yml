# Checks Tafona's own workflows on every PR and push to main, with actionlint
# (the standard linter for GitHub Actions workflows).
#
# Why: the nightly flow came from Claude with «Tafona: …» in a plain YAML
# scalar, and the whole file would not have loaded (26-11-2026). It was
# caught by hand; this catches it always.
#
# How to maintain: the version of actionlint is pinned below; raise it on
# purpose. A check that is wrong for us goes to -ignore with the reason.
name: Comprobar

on:
  pull_request:
    paths: [".github/workflows/**", "plantilla/**"]
  push:
    branches: [main]
    paths: [".github/workflows/**", "plantilla/**"]

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        run: |
          bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          # plantilla/ holds files meant for OTHER repos: checked too.
          ./actionlint -color .github/workflows/*.yml plantilla/*.yml
