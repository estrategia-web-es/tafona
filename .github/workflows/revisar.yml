# TAFONA · revisar — the decision stage: RUTINA, or a person decides.
#
# Called from each project's tafona.yml on a PR (opened/updated by a person)
# or by dispatch from «trabajar» (a PR Claude opened). It checks the PR,
# classifies it with the criterion below (approved by David on 26-11-2026),
# and when a person must decide: label «decide», ASSIGN it (David or Juan)
# and ONE concrete question. SHADOW MODE: it never approves or merges.
#
# How to maintain:
#   - The criterion lives in CRITERIO below, inside this file: Tafona is
#     private and a project's token cannot read its other files.
#   - A condition is added from a «rutina» PR that should not have been;
#     removed after many «decide» PRs that the person merged untouched. Write
#     the date and the case next to it.
#   - The criterion and the tools come from HERE, never from the PR under
#     review: a PR must not be able to rewrite its own review.
name: Tafona · revisar

on:
  workflow_call:
    inputs:
      pr: { type: string, required: true }
      # Empty for a repo with no site (the plugin, a tool): no «ssh prod».
      prod_host: { type: string, default: "" }
      prod_user: { type: string, default: "" }
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: { required: true }
      PROD_LECTURA_KEY: { required: false }
      TAFONA_TOKEN: { required: false }   # org secret: write to the board

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HAY_TABLERO: ${{ secrets.TAFONA_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ inputs.pr }}/head
          path: pr
          fetch-depth: 1

      - name: Herramientas y etiquetas
        env:
          LLAVE: ${{ secrets.PROD_LECTURA_KEY }}
          PROD_HOST: ${{ inputs.prod_host }}
          PROD_USER: ${{ inputs.prod_user }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$PROD_HOST" ]; then
            mkdir -p ~/.ssh && umask 077
            printf '%s\n' "$LLAVE" > ~/.ssh/prod
            printf 'Host prod\n  HostName %s\n  User %s\n  Port 18765\n  IdentityFile ~/.ssh/prod\n  IdentitiesOnly yes\n  StrictHostKeyChecking accept-new\n  BatchMode yes\n' "$PROD_HOST" "$PROD_USER" > ~/.ssh/config
            ssh prod wp core version
          else echo "sin web (un plugin, una herramienta): no hay ssh prod"; fi
          gh label create rutina -R "$GITHUB_REPOSITORY" --color 0e8a16 --description "Tafona: sin nada que decidir" --force
          gh label create decide -R "$GITHUB_REPOSITORY" --color d93f0b --description "Tafona: decide una persona (la asignada)" --force
          gh label create tafona -R "$GITHUB_REPOSITORY" --color 5319e7 --description "Tafona: un fallo del proceso, no del proyecto" --force

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: "github-actions"
          prompt: |
            ${{ inputs.prod_host == '' && 'ESTE REPO NO TIENE WEB: no hay `ssh prod` ni producción que mirar; no lo intentes. El YAML de los flujos y las pruebas de los guardianes los comprueba el flujo «Comprobar» de la PR (míralo con gh pr checks), no tú.' || '' }}
            Eres la REVISORA de Tafona. Revisa la PR #${{ inputs.pr }} de este repo. No la arreglas: compruebas, clasificas y das un veredicto. El código de la PR está en la carpeta pr/ (léelo ahí); la issue que arregla es la que cita «Refs #n» (gh issue view). Si la PR dice «Closes», «Fixes» o «Resolves» #n, es un fallo: esas palabras cierran la issue al fusionar, antes de verificarla. Dilo en el veredicto y corrígelo tú en la descripción (gh pr edit --body) cambiándolo por «Refs».

            1. COMPRUEBA
            - Que hace lo que dice la issue y nada más (gh pr diff).
            - php -l de cada PHP tocado en pr/; bash -n de cada script.
            - Si trae un script de WordPress: copia previa, --seco, cómo se deshace, el valor por la entrada estándar en `wp option patch` (printf '%s' "$v" | wp option patch …) y ICL_STRING_TRANSLATION_COMPLETE (no ICL_TL_COMPLETE). NO lo ejecutes: lee tú con `ssh prod wp …` los valores que su --seco imprimiría y di si coinciden con lo que la PR da por supuesto.
            - Contra la web real: `ssh prod wp <lectura>`, `ssh prod pagina /ruta` (solo lectura). curl contra nuestras webs recibe el antibots.
            - Lo que no puedas comprobar, DILO.

            2. CLASIFICA. Es DECIDE si se cumple cualquiera; si ninguna, RUTINA:
            - texto que verá el público escrito a mano (no cuentan %%excerpt%%, %%term_description%%, el título de la página);
            - un dato que solo tiene una persona o el cliente (NIF, dirección, imagen, correo);
            - lo legal (aviso legal, privacidad, cookies, accesibilidad);
            - lo que borra o no se deshace con una copia;
            - lo que cuesta dinero o da de alta un servicio;
            - lo que cambia cómo se ve la web más allá del arreglo;
            - lo que toca el plugin o el tema compartidos (más de una web);
            - tu comprobación ha fallado o te deja dudas.
            Una PR que mezcla las dos cosas es DECIDE entera.

            3. QUIÉN DECIDE (solo si es DECIDE): David (dpereztomas) para datos de cliente, textos al público, lo legal y lo que cuesta; Juan (SoporteEstrategiaWeb) para lo técnico del plugin o del tema compartidos; si no está claro, a los dos.

            4. VEREDICTO: un comentario en la PR (gh pr comment) que EMPIEZA por «RUTINA» o por «DECIDE @persona», con UNA pregunta concreta si es DECIDE, y una lista corta de lo comprobado y lo no comprobado. Después: gh pr edit ${{ inputs.pr }} --add-label rutina, o --add-label decide --add-assignee <persona>. Si la PR ya tenía la etiqueta contraria, quítala.

            5. UN FALLO SE CONVIERTE EN ISSUE. Si algo te impide comprobar (un permiso denegado, una herramienta que no funciona, un dato que no puedes leer), abre una issue (gh issue create) con la etiqueta `tafona` y el título «Tafona: …», con la orden exacta y el error, SIN la etiqueta claude; si falla el proyecto (pruebas rotas), una issue sin etiqueta. Mira antes con `gh issue list --label tafona --state open` que no exista ya, y di su número en tu veredicto.

            MODO SOMBRA (desde el 26-11-2026): no apruebas ni fusionas nada.
          claude_args: |
            --allowedTools "Read,Glob,Grep,Bash(gh pr view:*),Bash(gh pr checks:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr edit:*),Bash(gh issue view:*),Bash(php -l:*),Bash(bash -n:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(ssh prod:*),Bash(node --check:*),Bash(gh issue create:*),Bash(gh issue list:*),WebSearch"
            --max-turns 40

      # The PR is the card while it waits for a person: on the board with
      # GitHub's CLI (actions/add-to-project needs the PR in the event, and a
      # dispatched review has none). Adding twice is harmless. The board's
      # built-in workflows move it: added → Espera tu OK, merged → Aplicado.
      - name: Al tablero (la PR)
        if: ${{ always() && env.HAY_TABLERO == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.TAFONA_TOKEN }}
        # And straight to «Espera tu OK»: the board's built-in «Item added»
        # holds ONE status and cannot be duplicated per type, so it is set for
        # issues (→ Triaje) and the PR's status is set here (26-11-2026).
        run: |
          O=estrategia-web-es
          ITEM=$(gh project item-add 1 --owner $O --url "https://github.com/$GITHUB_REPOSITORY/pull/${{ inputs.pr }}" --format json -q .id)
          P=$(gh project view 1 --owner $O --format json -q .id)
          CAMPOS=$(gh project field-list 1 --owner $O --format json)
          F=$(jq -r '.fields[] | select(.name=="Status") | .id' <<< "$CAMPOS")
          OP=$(jq -r '.fields[] | select(.name=="Status") | .options[] | select(.name=="Espera tu OK") | .id' <<< "$CAMPOS")
          gh project item-edit --id "$ITEM" --project-id "$P" --field-id "$F" --single-select-option-id "$OP" >/dev/null
          echo "PR #${{ inputs.pr }} en el tablero, en «Espera tu OK»"
